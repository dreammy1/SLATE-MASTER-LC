# =============================================================================
#  SLATE DevOps OS — Master Dashboard
#  Keep-alive cron: pings the Render free service so it never spins down.
# =============================================================================
#  Render's free web service sleeps after 15 idle minutes. GitHub Actions runs on
#  a public schedule, so your dashboard stays awake even with every computer in
#  the house switched off — no cron-job.org account, no always-on PC.
#
#  FIRST-TIME SETUP
#  ----------------
#   Nothing. The URL is hardcoded in DEFAULT_APP_URL below, so there is no
#   repository secret to create and no Settings -> Secrets step to remember.
#   GitHub enables scheduled workflows on public repos by default. If the
#   workflow never runs, make the repo public, or go to Actions -> Keep Alive ->
#   Enable workflow.
#
#   To point the pinger at a different deployment, edit DEFAULT_APP_URL here and
#   commit — a repository secret (SLATE_APP_URL) still overrides it when set,
#   which is useful for a preview or staging service.
#
#  GitHub may delay scheduled jobs by a few minutes during busy periods. That is
#  fine: the margin between 10 minutes of pinging and Render's 15 minute idle
#  threshold is wide enough to absorb it.
# =============================================================================
name: Keep Alive

# The dashboard this pinger keeps awake. Hardcoded on purpose: a single master
# dashboard does not need a secret just to be remembered, and a missing secret
# silently disables the whole workflow (it used to fail with
# "SLATE_APP_URL secret is not set" and the service slept through every run).
# A SLATE_APP_URL repository secret, if one exists, wins over this value.
env:
  DEFAULT_APP_URL: https://slate-master-dashboard.onrender.com

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC, which does not matter for an
    # interval this short.
    - cron: "*/10 * * * *"
  workflow_dispatch: # lets you trigger a ping by hand from the Actions tab

concurrency:
  # A slow cold-start must not queue up behind the previous run.
  group: keepalive
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ping:
    name: Ping master dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Resolve the app URL
        id: url
        env:
          SLATE_APP_URL: ${{ secrets.SLATE_APP_URL }}
          # Repeated literally instead of ${{ env.* }}: the `env` context is not
          # available in every step position, and a blank here would restore the
          # very failure this file exists to prevent.
          DEFAULT_APP_URL: https://slate-master-dashboard.onrender.com
        run: |
          # Secret first (override), then the hardcoded default. Never empty, so
          # this step can no longer fail the way it did before.
          URL="${SLATE_APP_URL:-$DEFAULT_APP_URL}"
          URL="${URL%/}"
          echo "target=$URL" >> "$GITHUB_OUTPUT"
          echo "Pinging $URL/api/health"

      - name: Ping the health endpoint
        env:
          SLATE_APP_URL: ${{ steps.url.outputs.target }}
        run: node scripts/keepalive.js "$SLATE_APP_URL"

      - name: Record the result
        if: always()
        run: |
          echo "Run finished at $(date -u '+%Y-%m-%d %H:%M UTC')."
          echo "History: https://api.render.com  ·  Logs: Render dashboard -> Events"
