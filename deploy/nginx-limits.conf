# ─────────────────────────────────────────────────────────────
#  nginx http{} level settings for the SLATE Master Dashboard
#  Installed to: /etc/nginx/conf.d/slate-limits.conf
#  Installed by: deploy/deploy-free.sh
#
#  Why a separate file: `limit_req_zone` and `map` are only valid inside the
#  http{} block, but our server{} config lives in sites-available/. Dropping
#  this file into conf.d/ is the standard way to add http-level directives
#  without editing /etc/nginx/nginx.conf.
# ─────────────────────────────────────────────────────────────

# Upgrade handling for websockets: pass through if the client asked for one.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Brute-force protection for the login endpoints.
# 5 requests per IP per 10 seconds, with a small burst allowance.
limit_req_zone $binary_remote_addr zone=slate_login:10m rate=5r/10s;

# A general-purpose zone in case new routes need throttling later.
limit_req_zone $binary_remote_addr zone=slate_api:10m rate=30r/s;
