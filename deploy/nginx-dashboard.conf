# ─────────────────────────────────────────────────────────────
#  Nginx reverse proxy — SLATE DevOps OS Master Dashboard
#  Installed to: /etc/nginx/sites-available/slate-master
#  Enabled by:    ln -s /etc/nginx/sites-available/slate-master /etc/nginx/sites-enabled/
#  Installed by:  deploy/deploy-free.sh (also copies deploy/nginx-limits.conf
#                 into /etc/nginx/conf.d/, which declares the rate-limit zones
#                 and the $connection_upgrade map used below)
#
#  Design notes:
#   • Next.js binds to 127.0.0.1:3000 only, so port 3000 never needs to be
#     opened in the Oracle Security List — only 80 and 443.
#   • Login endpoints are rate limited to blunt credential stuffing.
#   • /health is unauthenticated but returns only the selftest summary.
# ─────────────────────────────────────────────────────────────
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Behind Cloudflare only: real client IP arrives in CF-Connecting-IP.
    # real_ip_header CF-Connecting-IP;
    # set_real_ip_from 173.245.48.0/20;

    # Never advertise the exact nginx version.
    server_tokens off;

    client_max_body_size 25m;

    # ── Security headers ──────────────────────────────────────
    add_header X-Content-Type-Options    "nosniff"            always;
    add_header X-Frame-Options           "SAMEORIGIN"         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Compression — Next.js assets are text-heavy.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/javascript
                      application/javascript application/json
                      application/xml image/svg+xml font/woff font/woff2;

    # ── Health check (public, cheap) ──────────────────────────
    location = /health {
        proxy_pass http://127.0.0.1:3000/api/selftest;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ── Login endpoints: rate limited ─────────────────────────
    # zone is declared in /etc/nginx/conf.d/slate-limits.conf
    location ~ ^/api/(admin|client)/login$ {
        limit_req zone=slate_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Block dotfiles & server internals ─────────────────────
    location ~ /\. { deny all; access_log off; log_not_found off; }
    location ~* /(data/db\.json|package\.json|package-lock\.json|\.env)$ {
        deny all; access_log off; log_not_found off;
    }
    location ^~ /data/    { deny all; }
    location ^~ /backups/ { deny all; }
    location ^~ /logs/    { deny all; }

    # ── Static assets: long cache, served straight through ────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── Everything else → Next.js ─────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / HMR
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long-running routes: deploy, sync-db, migration executor, pings.
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 60s;
        proxy_buffering       off;
    }
}

